<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Ultimate RPG</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    z-index:100;
    background:rgba(0,0,0,0.5);
    padding:15px;
    border-radius:15px;
    width:250px;
    backdrop-filter:blur(10px);
}

.bar{
    width:220px;
    height:18px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:10px;
}

.fill{
    height:100%;
    width:100%;
}

#hpFill{
    background:#ff4444;
}

#staminaFill{
    background:#44ff88;
}

#expFill{
    background:#44aaff;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    z-index:100;
}

#skillbar{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:100;
}

.skill{
    width:70px;
    height:70px;
    border-radius:20px;
    border:2px solid white;
    background:rgba(255,255,255,0.1);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    backdrop-filter:blur(10px);
}

</style>
</head>

<body>

<div id="crosshair">+</div>

<div id="ui">

<div>HP</div>
<div class="bar">
<div class="fill" id="hpFill"></div>
</div>

<div>STAMINA</div>
<div class="bar">
<div class="fill" id="staminaFill"></div>
</div>

<div>EXP</div>
<div class="bar">
<div class="fill" id="expFill"></div>
</div>

<div id="text">
LEVEL: 1<br>
COINS: 0<br>
ENEMIES: 20
</div>

</div>

<div id="skillbar">
<div class="skill">⚔️</div>
<div class="skill">🔥</div>
<div class="skill">⚡</div>
<div class="skill">❄️</div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152/build/three.module.js';


// ====================
// 基本
// ====================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x001133);

scene.fog = new THREE.Fog(0x001133,80,300);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);



// ====================
// ライト
// ====================

const ambient = new THREE.AmbientLight(0xffffff,0.7);

scene.add(ambient);

const moon = new THREE.DirectionalLight(0xffffff,1.5);

moon.position.set(50,100,50);

moon.castShadow = true;

scene.add(moon);



// ====================
// 地面
// ====================

const ground = new THREE.Mesh(

new THREE.PlaneGeometry(1000,1000),

new THREE.MeshStandardMaterial({
color:0x226622
})

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);



// ====================
// 星
// ====================

for(let i=0;i<1000;i++){

const star = new THREE.Mesh(

new THREE.SphereGeometry(0.15),

new THREE.MeshBasicMaterial({
color:0xffffff
})

);

star.position.set(
Math.random()*2000-1000,
Math.random()*800,
Math.random()*2000-1000
);

scene.add(star);

}



// ====================
// 木
// ====================

for(let i=0;i<200;i++){

const trunk = new THREE.Mesh(

new THREE.CylinderGeometry(0.5,0.7,6),

new THREE.MeshStandardMaterial({
color:0x663300
})

);

trunk.position.set(
Math.random()*900-450,
3,
Math.random()*900-450
);

scene.add(trunk);

const leaves = new THREE.Mesh(

new THREE.SphereGeometry(3),

new THREE.MeshStandardMaterial({
color:0x00aa00
})

);

leaves.position.set(
trunk.position.x,
trunk.position.y+5,
trunk.position.z
);

scene.add(leaves);

}



// ====================
// 山
// ====================

for(let i=0;i<40;i++){

const mountain = new THREE.Mesh(

new THREE.ConeGeometry(
10+Math.random()*20,
50+Math.random()*100,
6
),

new THREE.MeshStandardMaterial({
color:0x555555
})

);

mountain.position.set(
Math.random()*1500-750,
30,
Math.random()*1500-750
);

scene.add(mountain);

}



// ====================
// プレイヤー
// ====================

const player = new THREE.Group();

const body = new THREE.Mesh(

new THREE.CapsuleGeometry(0.8,2,4,8),

new THREE.MeshStandardMaterial({
color:0x3399ff
})

);

body.castShadow = true;

player.add(body);

const sword = new THREE.Mesh(

new THREE.BoxGeometry(0.15,2,0.3),

new THREE.MeshStandardMaterial({
color:0xdddddd,
emissive:0x555555
})

);

sword.position.set(1,0.5,0);

player.add(sword);

player.position.y = 3;

scene.add(player);



// ====================
// 視点
// ====================

document.body.requestPointerLock =
document.body.requestPointerLock ||
document.body.mozRequestPointerLock;

document.addEventListener("click",()=>{

document.body.requestPointerLock();

});

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove",(e)=>{

if(document.pointerLockElement===document.body){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-Math.PI/2,
Math.min(Math.PI/2,pitch)
);

camera.rotation.order = "YXZ";

camera.rotation.y = yaw;

camera.rotation.x = pitch;

}

});



// ====================
// 入力
// ====================

const keys = {};

document.addEventListener("keydown",(e)=>{

keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup",(e)=>{

keys[e.key.toLowerCase()] = false;

});



// ====================
// ステータス
// ====================

let hp = 100;
let stamina = 100;
let exp = 0;
let level = 1;
let coins = 0;

let velocityY = 0;
let onGround = false;



// ====================
// 敵
// ====================

const enemies = [];

function createEnemy(){

const enemy = new THREE.Mesh(

new THREE.BoxGeometry(2,3,2),

new THREE.MeshStandardMaterial({
color:0xaa0000
})

);

enemy.position.set(
Math.random()*300-150,
2,
Math.random()*300-150
);

enemy.hp = 5;

scene.add(enemy);

enemies.push(enemy);

}

for(let i=0;i<20;i++){
createEnemy();
}



// ====================
// パーティクル
// ====================

const particles = [];

function burst(x,y,z,color){

for(let i=0;i<20;i++){

const p = new THREE.Mesh(

new THREE.SphereGeometry(0.08),

new THREE.MeshBasicMaterial({
color:color
})

);

p.position.set(x,y,z);

p.vx = Math.random()-0.5;
p.vy = Math.random();
p.vz = Math.random()-0.5;

scene.add(p);

particles.push(p);

}

}



// ====================
// 攻撃
// ====================

let attacking = false;

document.addEventListener("mousedown",()=>{

attacking = true;

setTimeout(()=>{
attacking = false;
},200);

enemies.forEach((enemy,index)=>{

const dist = enemy.position.distanceTo(camera.position);

if(dist < 5){

enemy.hp--;

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0xff0000
);

enemy.position.x +=
(enemy.position.x-camera.position.x)*0.2;

enemy.position.z +=
(enemy.position.z-camera.position.z)*0.2;

if(enemy.hp<=0){

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0xffff00
);

scene.remove(enemy);

enemies.splice(index,1);

coins += 10;

exp += 20;

if(exp>=100){

exp=0;

level++;

hp=100;

}

createEnemy();

}

}

});

});



// ====================
// 魔法
// ====================

const magicBalls = [];

function castMagic(color){

const ball = new THREE.Mesh(

new THREE.SphereGeometry(0.5),

new THREE.MeshBasicMaterial({
color:color
})

);

ball.position.copy(camera.position);

ball.dir = new THREE.Vector3(0,0,-1);

ball.dir.applyQuaternion(camera.quaternion);

scene.add(ball);

magicBalls.push(ball);

}

document.addEventListener("keydown",(e)=>{

if(e.key==="1"){
castMagic(0xff5500);
}

if(e.key==="2"){
castMagic(0x00ffff);
}

if(e.key==="3"){
castMagic(0xaa00ff);
}

});



// ====================
// アニメーション
// ====================

function animate(){

requestAnimationFrame(animate);



// 移動

let speed = 0.18;

if(keys["shift"] && stamina>0){

speed = 0.35;

stamina -= 0.4;

}else{

stamina += 0.2;

}

stamina = Math.max(0,Math.min(100,stamina));

if(keys["w"]){

camera.position.x -= Math.sin(yaw)*speed;

camera.position.z -= Math.cos(yaw)*speed;

}

if(keys["s"]){

camera.position.x += Math.sin(yaw)*speed;

camera.position.z += Math.cos(yaw)*speed;

}

if(keys["a"]){

camera.position.x -= Math.cos(yaw)*speed;

camera.position.z += Math.sin(yaw)*speed;

}

if(keys["d"]){

camera.position.x += Math.cos(yaw)*speed;

camera.position.z -= Math.sin(yaw)*speed;

}



// ジャンプ

if(keys[" "] && onGround){

velocityY = 0.4;

onGround = false;

}

velocityY -= 0.02;

camera.position.y += velocityY;

if(camera.position.y < 5){

camera.position.y = 5;

velocityY = 0;

onGround = true;

}



// プレイヤー同期

player.position.copy(camera.position);

player.position.y -= 2;



// 剣アニメ

if(attacking){

sword.rotation.z =
-Math.sin(Date.now()*0.05)*2.5;

}else{

sword.rotation.z = 0;

}



// 敵AI

enemies.forEach(enemy=>{

enemy.lookAt(camera.position);

const dir = new THREE.Vector3();

dir.subVectors(
camera.position,
enemy.position
).normalize();

enemy.position.add(
dir.multiplyScalar(0.03)
);

if(enemy.position.distanceTo(camera.position)<2){

hp -= 0.05;

}

});



// 魔法

magicBalls.forEach((ball,index)=>{

ball.position.add(
ball.dir.clone().multiplyScalar(1)
);

enemies.forEach((enemy,eIndex)=>{

const d = ball.position.distanceTo(enemy.position);

if(d<2){

enemy.hp -= 3;

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0x00ffff
);

scene.remove(ball);

magicBalls.splice(index,1);

if(enemy.hp<=0){

scene.remove(enemy);

enemies.splice(eIndex,1);

coins += 20;

exp += 30;

createEnemy();

}

}

});

});



// パーティクル

particles.forEach((p,index)=>{

p.position.x += p.vx*0.1;
p.position.y += p.vy*0.1;
p.position.z += p.vz*0.1;

p.vy -= 0.01;

p.scale.multiplyScalar(0.96);

if(p.scale.x<0.02){

scene.remove(p);

particles.splice(index,1);

}

});



// UI

document.getElementById("hpFill")
.style.width = hp + "%";

document.getElementById("staminaFill")
.style.width = stamina + "%";

document.getElementById("expFill")
.style.width = exp + "%";

document.getElementById("text").innerHTML =

`
LEVEL: ${level}<br>
COINS: ${coins}<br>
ENEMIES: ${enemies.length}<br><br>

1 炎魔法<br>
2 氷魔法<br>
3 雷魔法
`;



// GAME OVER

if(hp<=0){

alert("GAME OVER");

location.reload();

}



renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
