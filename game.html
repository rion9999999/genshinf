<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ULTIMATE OPEN WORLD RPG</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    width:280px;
    background:rgba(0,0,0,0.5);
    padding:15px;
    border-radius:20px;
    color:white;
    z-index:100;
    backdrop-filter:blur(10px);
}

.bar{
    width:240px;
    height:18px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:10px;
}

.fill{
    height:100%;
}

#hp{background:#ff4444;width:100%;}
#stamina{background:#44ff88;width:100%;}
#mana{background:#4499ff;width:100%;}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    z-index:100;
}

#skillbar{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    z-index:100;
}

.skill{
    width:70px;
    height:70px;
    border-radius:20px;
    border:2px solid white;
    background:rgba(255,255,255,0.1);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
    backdrop-filter:blur(10px);
}

</style>
</head>

<body>

<div id="crosshair">+</div>

<div id="ui">

HP
<div class="bar"><div class="fill" id="hp"></div></div>

STAMINA
<div class="bar"><div class="fill" id="stamina"></div></div>

MANA
<div class="bar"><div class="fill" id="mana"></div></div>

<div id="stats">
LEVEL 1<br>
COINS 0<br>
ENEMIES 25
</div>

</div>

<div id="skillbar">
<div class="skill">⚔️</div>
<div class="skill">🔥</div>
<div class="skill">⚡</div>
<div class="skill">❄️</div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152/build/three.module.js';




// =====================================
// 基本
// =====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000814);

scene.fog = new THREE.Fog(0x000814,100,500);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
3000
);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);




// =====================================
// ライト
// =====================================

const ambient = new THREE.AmbientLight(0xffffff,0.7);

scene.add(ambient);

const moon = new THREE.DirectionalLight(0xaaccff,2);

moon.position.set(100,200,100);

moon.castShadow = true;

scene.add(moon);




// =====================================
// 地面
// =====================================

const ground = new THREE.Mesh(

new THREE.PlaneGeometry(3000,3000),

new THREE.MeshStandardMaterial({
color:0x224422
})

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);




// =====================================
// 星空
// =====================================

for(let i=0;i<2000;i++){

const star = new THREE.Mesh(

new THREE.SphereGeometry(0.2),

new THREE.MeshBasicMaterial({
color:0xffffff
})

);

star.position.set(
Math.random()*4000-2000,
Math.random()*1000,
Math.random()*4000-2000
);

scene.add(star);

}




// =====================================
// 木
// =====================================

for(let i=0;i<300;i++){

const trunk = new THREE.Mesh(

new THREE.CylinderGeometry(0.5,0.7,7),

new THREE.MeshStandardMaterial({
color:0x663300
})

);

trunk.position.set(
Math.random()*2500-1250,
3,
Math.random()*2500-1250
);

scene.add(trunk);

const leaves = new THREE.Mesh(

new THREE.SphereGeometry(4),

new THREE.MeshStandardMaterial({
color:0x00aa00
})

);

leaves.position.set(
trunk.position.x,
trunk.position.y+6,
trunk.position.z
);

scene.add(leaves);

}




// =====================================
// 山
// =====================================

for(let i=0;i<60;i++){

const mountain = new THREE.Mesh(

new THREE.ConeGeometry(
20+Math.random()*40,
100+Math.random()*200,
6
),

new THREE.MeshStandardMaterial({
color:0x555555
})

);

mountain.position.set(
Math.random()*3000-1500,
50,
Math.random()*3000-1500
);

scene.add(mountain);

}




// =====================================
// 視点移動
// =====================================

document.body.requestPointerLock =
document.body.requestPointerLock ||
document.body.mozRequestPointerLock;

document.addEventListener("click",()=>{

document.body.requestPointerLock();

});

let yaw = 0;
let pitch = 0;

document.addEventListener("mousemove",(e)=>{

if(document.pointerLockElement===document.body){

yaw -= e.movementX * 0.002;

pitch -= e.movementY * 0.002;

pitch = Math.max(
-Math.PI/2,
Math.min(Math.PI/2,pitch)
);

camera.rotation.order = "YXZ";

camera.rotation.y = yaw;

camera.rotation.x = pitch;

}

});




// =====================================
// 入力
// =====================================

const keys = {};

document.addEventListener("keydown",(e)=>{

keys[e.key.toLowerCase()] = true;

});

document.addEventListener("keyup",(e)=>{

keys[e.key.toLowerCase()] = false;

});




// =====================================
// ステータス
// =====================================

let hpValue = 100;
let staminaValue = 100;
let manaValue = 100;

let level = 1;
let coins = 0;
let exp = 0;

let velocityY = 0;
let onGround = false;




// =====================================
// 武器
// =====================================

const sword = new THREE.Mesh(

new THREE.BoxGeometry(0.2,2,0.3),

new THREE.MeshStandardMaterial({
color:0xffffff,
emissive:0x444444
})

);

scene.add(sword);




// =====================================
// 敵
// =====================================

const enemies = [];

function createEnemy(){

const enemy = new THREE.Mesh(

new THREE.BoxGeometry(3,4,3),

new THREE.MeshStandardMaterial({
color:0xaa0000
})

);

enemy.position.set(
Math.random()*600-300,
2,
Math.random()*600-300
);

enemy.hp = 5;

scene.add(enemy);

enemies.push(enemy);

}

for(let i=0;i<25;i++){
createEnemy();
}




// =====================================
// パーティクル
// =====================================

const particles = [];

function burst(x,y,z,color){

for(let i=0;i<25;i++){

const p = new THREE.Mesh(

new THREE.SphereGeometry(0.1),

new THREE.MeshBasicMaterial({
color:color
})

);

p.position.set(x,y,z);

p.vx = Math.random()-0.5;
p.vy = Math.random();
p.vz = Math.random()-0.5;

scene.add(p);

particles.push(p);

}

}




// =====================================
// 魔法
// =====================================

const spells = [];

function castSpell(color){

if(manaValue <= 10) return;

manaValue -= 10;

const ball = new THREE.Mesh(

new THREE.SphereGeometry(0.6),

new THREE.MeshBasicMaterial({
color:color
})

);

ball.position.copy(camera.position);

ball.dir = new THREE.Vector3(0,0,-1);

ball.dir.applyQuaternion(camera.quaternion);

scene.add(ball);

spells.push(ball);

}

document.addEventListener("keydown",(e)=>{

if(e.key==="1"){
castSpell(0xff5500);
}

if(e.key==="2"){
castSpell(0x00ffff);
}

if(e.key==="3"){
castSpell(0xaa00ff);
}

});




// =====================================
// 攻撃
// =====================================

let attacking = false;

document.addEventListener("mousedown",()=>{

attacking = true;

setTimeout(()=>{
attacking = false;
},200);

enemies.forEach((enemy,index)=>{

const dist = enemy.position.distanceTo(camera.position);

if(dist < 6){

enemy.hp--;

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0xff0000
);

enemy.position.x +=
(enemy.position.x-camera.position.x)*0.3;

enemy.position.z +=
(enemy.position.z-camera.position.z)*0.3;

if(enemy.hp<=0){

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0xffff00
);

scene.remove(enemy);

enemies.splice(index,1);

coins += 10;

exp += 20;

if(exp>=100){

exp = 0;

level++;

hpValue = 100;

}

createEnemy();

}

}

});

});




// =====================================
// 初期位置
// =====================================

camera.position.set(0,5,10);




// =====================================
// メインループ
// =====================================

function animate(){

requestAnimationFrame(animate);




// 移動

let speed = 0.25;

if(keys["shift"] && staminaValue>0){

speed = 0.5;

staminaValue -= 0.5;

}else{

staminaValue += 0.2;

}

staminaValue = Math.max(0,Math.min(100,staminaValue));

manaValue += 0.05;

manaValue = Math.min(100,manaValue);

if(keys["w"]){

camera.position.x -= Math.sin(yaw)*speed;

camera.position.z -= Math.cos(yaw)*speed;

}

if(keys["s"]){

camera.position.x += Math.sin(yaw)*speed;

camera.position.z += Math.cos(yaw)*speed;

}

if(keys["a"]){

camera.position.x -= Math.cos(yaw)*speed;

camera.position.z += Math.sin(yaw)*speed;

}

if(keys["d"]){

camera.position.x += Math.cos(yaw)*speed;

camera.position.z -= Math.sin(yaw)*speed;

}




// ジャンプ

if(keys[" "] && onGround){

velocityY = 0.45;

onGround = false;

}

velocityY -= 0.02;

camera.position.y += velocityY;

if(camera.position.y < 5){

camera.position.y = 5;

velocityY = 0;

onGround = true;

}




// 剣

sword.position.copy(camera.position);

const forward = new THREE.Vector3(0,0,-1);

forward.applyQuaternion(camera.quaternion);

sword.position.add(forward.multiplyScalar(1.5));

sword.position.y -= 0.7;

sword.rotation.copy(camera.rotation);

if(attacking){

sword.rotation.z =
-Math.sin(Date.now()*0.05)*2;

}




// 敵AI

enemies.forEach(enemy=>{

enemy.lookAt(camera.position);

const dir = new THREE.Vector3();

dir.subVectors(
camera.position,
enemy.position
).normalize();

enemy.position.add(
dir.multiplyScalar(0.04)
);

if(enemy.position.distanceTo(camera.position)<2){

hpValue -= 0.05;

}

});




// 魔法更新

spells.forEach((spell,index)=>{

spell.position.add(
spell.dir.clone().multiplyScalar(1.5)
);

enemies.forEach((enemy,eIndex)=>{

const d = spell.position.distanceTo(enemy.position);

if(d<3){

enemy.hp -= 3;

burst(
enemy.position.x,
enemy.position.y,
enemy.position.z,
0x00ffff
);

scene.remove(spell);

spells.splice(index,1);

if(enemy.hp<=0){

scene.remove(enemy);

enemies.splice(eIndex,1);

coins += 20;

exp += 30;

createEnemy();

}

}

});

});




// パーティクル

particles.forEach((p,index)=>{

p.position.x += p.vx*0.1;
p.position.y += p.vy*0.1;
p.position.z += p.vz*0.1;

p.vy -= 0.01;

p.scale.multiplyScalar(0.96);

if(p.scale.x<0.02){

scene.remove(p);

particles.splice(index,1);

}

});




// UI

document.getElementById("hp").style.width =
hpValue + "%";

document.getElementById("stamina").style.width =
staminaValue + "%";

document.getElementById("mana").style.width =
manaValue + "%";

document.getElementById("stats").innerHTML =

`
LEVEL ${level}<br>
COINS ${coins}<br>
ENEMIES ${enemies.length}<br><br>

WASD 移動<br>
SHIFT ダッシュ<br>
SPACE ジャンプ<br>
CLICK 剣攻撃<br>
1 2 3 魔法
`;




// GAME OVER

if(hpValue<=0){

alert("GAME OVER");

location.reload();

}




renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
